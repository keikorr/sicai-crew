<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SICAI</title>
<style>
  :root {
    --fundo: #f4f5f7; --painel: #ffffff; --borda: #d9dde3; --texto: #1b2330;
    --suave: #5d6878; --marca: #1f4e8c; --marca-suave: #e6eef9; --ok: #1d7a4a;
    --alerta: #9a5b00; --alerta-fundo: #fff4dd; --erro: #a12b2b; --erro-fundo: #fdeaea;
    --usuario: #1f4e8c; --raio: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #12161c; --painel: #1a2029; --borda: #2c3542; --texto: #e4e8ee;
      --suave: #9aa5b5; --marca: #7fb0ee; --marca-suave: #1e2d42; --ok: #5fca92;
      --alerta: #f0b95a; --alerta-fundo: #33291a; --erro: #f08a8a; --erro-fundo: #3a2020;
      --usuario: #2b5c9e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 10px 16px; background: var(--painel); border-bottom: 1px solid var(--borda);
  }
  header h1 { font-size: 17px; margin: 0 8px 0 0; letter-spacing: .04em; color: var(--marca); }
  header .espaco { flex: 1; }
  header small { color: var(--suave); }
  label { font-size: 13px; color: var(--suave); }
  select, input[type=text], input[type=password], textarea {
    font: inherit; color: inherit; background: var(--fundo);
    border: 1px solid var(--borda); border-radius: 6px; padding: 6px 9px;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 6px; padding: 6px 12px;
    border: 1px solid var(--borda); background: var(--painel); color: var(--texto);
  }
  button.principal { background: var(--marca); border-color: var(--marca); color: #fff; }
  @media (prefers-color-scheme: dark) { button.principal { color: #10151c; } }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px 1fr; }
  aside {
    border-right: 1px solid var(--borda); background: var(--painel);
    padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
             color: var(--suave); margin: 0 0 8px; }
  .doc { padding: 7px 0; border-bottom: 1px solid var(--borda); font-size: 13.5px; }
  .doc:last-child { border-bottom: 0; }
  .doc b { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .doc span { color: var(--suave); }
  .vazio { color: var(--suave); font-size: 13.5px; }
  .envio { display: flex; flex-direction: column; gap: 8px; }
  .envio label { display: flex; gap: 6px; align-items: center; }
  #job { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--marca-suave);
         overflow-wrap: anywhere; }
  #job.erro { background: var(--erro-fundo); color: var(--erro); }
  section { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  nav { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid var(--borda);
        background: var(--painel); overflow-x: auto; }
  nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0;
               background: none; color: var(--suave); padding: 8px 12px; white-space: nowrap; }
  nav button.ativo { color: var(--marca); border-bottom-color: var(--marca); font-weight: 600; }
  .aba { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .aba.ativa { display: flex; }
  #mensagens { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex;
               flex-direction: column; gap: 14px; }
  .msg { max-width: min(860px, 92%); padding: 10px 14px; border-radius: var(--raio);
         background: var(--painel); border: 1px solid var(--borda); overflow-wrap: anywhere; }
  .msg.usuario { align-self: flex-end; background: var(--usuario); border-color: var(--usuario);
                 color: #fff; white-space: pre-wrap; }
  .msg.erro { background: var(--erro-fundo); border-color: var(--erro); color: var(--erro); }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 0 0 8px; padding-left: 20px; }
  .msg blockquote { margin: 8px 0; padding: 6px 10px; border-left: 3px solid var(--alerta);
                    background: var(--alerta-fundo); color: var(--alerta); border-radius: 4px; }
  .rolagem { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { border: 1px solid var(--borda); padding: 6px 9px; text-align: left; vertical-align: top;
           min-width: 96px; overflow-wrap: break-word; word-break: normal; }
  th { background: var(--marca-suave); font-weight: 600; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .selo { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--marca-suave);
          color: var(--marca); }
  .selo.ok { color: var(--ok); } .selo.alerta { background: var(--alerta-fundo); color: var(--alerta); }
  details { margin-top: 8px; font-size: 13px; color: var(--suave); }
  details summary { cursor: pointer; }
  form#pergunta { display: flex; gap: 8px; padding: 12px 16px; background: var(--painel);
                  border-top: 1px solid var(--borda); }
  form#pergunta textarea { flex: 1; resize: none; height: 44px; }
  .sugestoes { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; background: var(--painel); }
  .sugestoes button { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; color: var(--suave); }
  #registros { flex: 1; overflow: auto; padding: 16px; }
  .subabas { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .subabas button.ativo { background: var(--marca-suave); border-color: var(--marca); color: var(--marca); }
  .oculto { display: none !important; }
  @media (max-width: 760px) {
    body { height: auto; min-height: 100vh; }
    main { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--borda); }
    #mensagens { min-height: 50vh; }
  }
</style>
</head>
<body>

<header>
  <h1>SICAI</h1>
  <label for="processo">Processo</label>
  <select id="processo"></select>
  <input type="text" id="novo-processo" placeholder="novo processo" size="14"
         pattern="[A-Za-z0-9_][A-Za-z0-9._-]{0,63}" aria-label="Identificador de um novo processo">
  <button id="criar">Abrir</button>
  <span class="espaco"></span>
  <span id="chave-area" class="oculto">
    <label for="chave">Chave</label>
    <input type="password" id="chave" size="14" autocomplete="off">
  </span>
  <small id="modelo"></small>
</header>

<main>
  <aside>
    <div>
      <h2>Documentos</h2>
      <div id="documentos" class="vazio">Escolha ou abra um processo.</div>
    </div>
    <div>
      <h2>Adicionar PDFs</h2>
      <form class="envio" id="envio">
        <input type="file" id="arquivos" accept="application/pdf,.pdf" multiple required>
        <label><input type="checkbox" id="com-agentes" checked>
          Extrair com agentes (lento, usa o modelo)</label>
        <button class="principal" id="enviar">Enviar e ingerir</button>
      </form>
    </div>
    <div id="job" class="oculto" role="status"></div>
  </aside>

  <section>
    <nav>
      <button data-aba="conversa" class="ativo">Conversa</button>
      <button data-aba="base">Base estruturada</button>
    </nav>

    <div class="aba ativa" id="aba-conversa">
      <div id="mensagens" aria-live="polite"></div>
      <div class="sugestoes" id="sugestoes"></div>
      <form id="pergunta">
        <textarea id="texto" placeholder="Pergunte sobre o processo" aria-label="Pergunta"></textarea>
        <button class="principal" id="perguntar">Enviar</button>
      </form>
    </div>

    <div class="aba" id="aba-base">
      <div id="registros">
        <div class="subabas" id="subabas"></div>
        <div class="rolagem" id="tabela"></div>
      </div>
    </div>
  </section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const estado = { processo: "", historico: [], categoria: "pessoa", contagem: {}, ocupado: false };

const SUGESTOES = [
  "Quais pessoas são citadas e qual o papel de cada uma?",
  "Quais crimes foram imputados e a quem?",
  "Quais equipamentos foram apreendidos?",
  "Descreva a cadeia de custódia dos itens apreendidos",
  "Há divergências entre as peças?",
];
const CATEGORIAS = { pessoa: "Pessoas", crime: "Crimes", equipamento: "Equipamentos", evento: "Eventos" };
const ROTAS = {
  casual: "conversa", identificador: "busca por identificador", pessoas: "especialista em pessoas",
  crimes: "especialista em crimes", equipamentos: "especialista em equipamentos",
  custodia: "analista de custódia", inconsistencias: "analista de inconsistências",
  conformidade: "analista de conformidade", narrativa: "analista de peças",
};

// ------------------------------------------------------------------ rede

async function api(caminho, opcoes = {}) {
  const cabecalhos = { ...(opcoes.headers || {}) };
  const chave = $("chave").value;
  if (chave) cabecalhos["X-API-Key"] = chave;
  const resposta = await fetch(caminho, { ...opcoes, headers: cabecalhos });
  const corpo = await resposta.json().catch(() => ({}));
  if (!resposta.ok) {
    const detalhe = typeof corpo.detail === "string" ? corpo.detail : `Erro ${resposta.status}`;
    throw new Error(detalhe);
  }
  return corpo;
}

// ------------------------------------------- texto do modelo -> elementos
// Tudo entra por textContent: a resposta do modelo e o conteúdo dos autos
// nunca são interpretados como HTML.

function emLinha(texto, destino) {
  for (const parte of texto.split(/(\*\*[^*]+\*\*)/)) {
    if (/^\*\*[^*]+\*\*$/.test(parte)) {
      const forte = document.createElement("strong");
      forte.textContent = parte.slice(2, -2);
      destino.append(forte);
    } else if (parte) {
      destino.append(parte);
    }
  }
}

function celulas(linha) {
  return linha.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
}

function renderizar(texto) {
  const raiz = document.createElement("div");
  const linhas = texto.split("\n");
  let i = 0;
  while (i < linhas.length) {
    const linha = linhas[i];
    if (!linha.trim()) { i++; continue; }

    if (linha.trim().startsWith("|")) {
      const bloco = [];
      while (i < linhas.length && linhas[i].trim().startsWith("|")) bloco.push(linhas[i++]);
      const tabela = document.createElement("table");
      bloco.filter((l) => !/^[\s|:-]+$/.test(l)).forEach((l, n) => {
        const tr = tabela.insertRow();
        for (const valor of celulas(l)) {
          const celula = document.createElement(n === 0 ? "th" : "td");
          emLinha(valor, celula);
          tr.append(celula);
        }
      });
      const caixa = document.createElement("div");
      caixa.className = "rolagem";
      caixa.append(tabela);
      raiz.append(caixa);
      continue;
    }

    const tipos = [[/^\s*>\s?/, "blockquote"], [/^\s*[-*]\s+/, "ul"]];
    const tipo = tipos.find(([padrao]) => padrao.test(linha));
    if (tipo) {
      const [padrao, tag] = tipo;
      const elemento = document.createElement(tag);
      while (i < linhas.length && padrao.test(linhas[i])) {
        const conteudo = linhas[i++].replace(padrao, "").replace(/^[-*]\s+/, "");
        const item = document.createElement(tag === "ul" ? "li" : "div");
        emLinha(conteudo, item);
        elemento.append(item);
      }
      raiz.append(elemento);
      continue;
    }

    const paragrafo = document.createElement("p");
    emLinha(linha.replace(/^#+\s*/, ""), paragrafo);
    raiz.append(paragrafo);
    i++;
  }
  return raiz;
}

// --------------------------------------------------------------- conversa

function selo(texto, classe = "") {
  const s = document.createElement("span");
  s.className = `selo ${classe}`.trim();
  s.textContent = texto;
  return s;
}

function mensagem(classe, conteudo) {
  const caixa = document.createElement("div");
  caixa.className = `msg ${classe}`;
  if (typeof conteudo === "string") caixa.textContent = conteudo; else caixa.append(conteudo);
  $("mensagens").append(caixa);
  caixa.scrollIntoView({ block: "end" });
  return caixa;
}

function mostrarResposta(dados) {
  const corpo = renderizar(dados.response);
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.append(selo(ROTAS[dados.rota] || dados.rota));
  if (dados.rota !== "casual") {
    if (dados.pendencias.length) meta.append(selo(`${dados.pendencias.length} citação(ões) não confirmada(s)`, "alerta"));
    else meta.append(selo(dados.revisada ? "corrigida pelo revisor" : "citações conferidas", "ok"));
  }
  corpo.append(meta);

  if (dados.fontes.length) {
    const fontes = document.createElement("details");
    const titulo = document.createElement("summary");
    titulo.textContent = `Fontes enviadas ao agente (${dados.fontes.length})`;
    fontes.append(titulo);
    const lista = document.createElement("ul");
    for (const fonte of dados.fontes) {
      const item = document.createElement("li");
      item.textContent = `${fonte.documento}, p. ${fonte.pagina}`;
      lista.append(item);
    }
    fontes.append(lista);
    corpo.append(fontes);
  }
  mensagem("assistente", corpo);
}

async function perguntar(texto) {
  texto = texto.trim();
  if (!texto || estado.ocupado) return;
  if (!estado.processo) { mensagem("erro", "Escolha ou abra um processo primeiro."); return; }

  estado.ocupado = true;
  $("perguntar").disabled = true;
  $("texto").value = "";
  mensagem("usuario", texto);
  const espera = mensagem("assistente", "Os agentes estão trabalhando…");
  try {
    const dados = await api("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ processo_id: estado.processo, message: texto, history: estado.historico }),
    });
    espera.remove();
    mostrarResposta(dados);
    estado.historico.push({ role: "user", content: texto }, { role: "assistant", content: dados.response });
    estado.historico = estado.historico.slice(-8);
  } catch (erro) {
    espera.remove();
    mensagem("erro", erro.message);
  } finally {
    estado.ocupado = false;
    $("perguntar").disabled = false;
    $("texto").focus();
  }
}

// --------------------------------------------------- processo e documentos

async function carregarProcessos(selecionar) {
  const lista = await api("/api/processos");
  const seletor = $("processo");
  seletor.replaceChildren(new Option("— escolha —", ""));
  for (const p of lista) seletor.add(new Option(`${p.processo_id} (${p.documentos} doc.)`, p.processo_id));
  if (selecionar && !lista.some((p) => p.processo_id === selecionar)) seletor.add(new Option(selecionar, selecionar));
  seletor.value = selecionar || estado.processo || "";
}

async function abrirProcesso(processo) {
  if (processo !== estado.processo) {
    estado.historico = [];
    $("mensagens").replaceChildren();
  }
  estado.processo = processo;
  if (!processo) return;

  const resumo = await api(`/api/processos/${encodeURIComponent(processo)}`);
  estado.contagem = resumo.registros;
  const caixa = $("documentos");
  caixa.replaceChildren();
  caixa.className = resumo.documentos.length ? "" : "vazio";
  if (!resumo.documentos.length) caixa.textContent = "Nenhum documento ingerido. Envie PDFs abaixo.";
  for (const doc of resumo.documentos) {
    const linha = document.createElement("div");
    linha.className = "doc";
    const nome = document.createElement("b");
    nome.textContent = doc.nome;
    const detalhe = document.createElement("span");
    detalhe.textContent = `${doc.tipo_peca} · ${doc.paginas} pág.`;
    linha.append(nome, detalhe);
    caixa.append(linha);
  }
  desenharSubabas();
  await carregarRegistros();
}

// ---------------------------------------------------------- base estruturada

function desenharSubabas() {
  const barra = $("subabas");
  barra.replaceChildren();
  for (const [categoria, rotulo] of Object.entries(CATEGORIAS)) {
    const botao = document.createElement("button");
    botao.textContent = `${rotulo} (${estado.contagem[categoria] || 0})`;
    botao.className = categoria === estado.categoria ? "ativo" : "";
    botao.onclick = () => { estado.categoria = categoria; desenharSubabas(); carregarRegistros(); };
    barra.append(botao);
  }
}

function fontes(registro) {
  return registro.fontes.map((f) => `${f.documento}, p. ${f.pagina}`).join("; ");
}

const COLUNAS = {
  pessoa: [
    ["Nome", (r) => r.dados.nome],
    ["Variações", (r) => (r.dados.variacoes || []).join(", ")],
    ["CPF", (r) => r.dados.cpf],
    ["Papéis conforme a peça", (r) => (r.dados.papeis || []).map((p) => `${p.papel} (${p.documento}, p. ${p.pagina})`).join("; ")],
    ["Fontes", fontes],
  ],
  crime: [
    ["Crime", (r) => r.dados.descricao],
    ["Artigo", (r) => r.dados.artigo],
    ["Autor(es) apontado(s)", (r) => (r.dados.autores || []).join(", ")],
    ["Status", (r) => r.dados.status],
    ["Fontes", fontes],
  ],
  equipamento: [
    ["Tipo", (r) => [r.dados.tipo, r.dados.subtipo].filter(Boolean).join(" / ")],
    ["Marca", (r) => r.dados.marca],
    ["Qtde", (r) => r.dados.quantidade],
    ["Lacre", (r) => r.dados.lacre],
    ["Identificadores", (r) => (r.dados.identificadores || []).join(", ")],
    ["Pessoa relacionada", (r) => r.dados.pessoa_relacionada],
    ["Observações", (r) => r.dados.observacoes],
    ["Fontes", fontes],
  ],
  evento: [
    ["Ato", (r) => r.dados.tipo_evento],
    ["Data", (r) => r.dados.data],
    ["Item", (r) => r.dados.item],
    ["Responsável", (r) => r.dados.responsavel],
    ["Descrição", (r) => r.dados.descricao],
    ["Fontes", fontes],
  ],
};

async function carregarRegistros() {
  const caixa = $("tabela");
  caixa.replaceChildren();
  if (!estado.processo) return;
  const registros = await api(`/api/processos/${encodeURIComponent(estado.processo)}/registros/${estado.categoria}`);
  if (!registros.length) {
    const aviso = document.createElement("p");
    aviso.className = "vazio";
    aviso.textContent = "Nenhum registro desta categoria. Eles são criados na ingestão.";
    caixa.append(aviso);
    return;
  }
  const colunas = COLUNAS[estado.categoria];
  const tabela = document.createElement("table");
  const cabecalho = tabela.insertRow();
  for (const [titulo] of colunas) {
    const th = document.createElement("th");
    th.textContent = titulo;
    cabecalho.append(th);
  }
  for (const registro of registros) {
    const linha = tabela.insertRow();
    for (const [, valor] of colunas) linha.insertCell().textContent = valor(registro) || "não informado";
  }
  caixa.append(tabela);
}

// ----------------------------------------------------------------- ingestão

function mostrarJob(texto, erro = false) {
  const caixa = $("job");
  caixa.textContent = texto;
  caixa.className = erro ? "erro" : "";
}

async function acompanhar(jobId) {
  for (;;) {
    await new Promise((r) => setTimeout(r, 2000));
    const job = await api(`/api/ingest/${jobId}`);
    if (job.status === "concluída") {
      const erros = (job.resumo.erros || []).length;
      const docs = (job.resumo.documentos || []).length;
      mostrarJob(`Ingestão concluída: ${docs} documento(s)` + (erros ? `, ${erros} erro(s).` : "."), erros > 0);
      await carregarProcessos(job.processo_id);
      await abrirProcesso(job.processo_id);
      return;
    }
    if (job.status === "falhou") { mostrarJob("A ingestão falhou. Veja o log do servidor.", true); return; }
    mostrarJob(`Ingestão ${job.status}${job.etapa ? ": " + job.etapa : ""}`);
  }
}

$("envio").addEventListener("submit", async (evento) => {
  evento.preventDefault();
  if (!estado.processo) { mostrarJob("Escolha ou abra um processo primeiro.", true); return; }
  const dados = new FormData();
  for (const arquivo of $("arquivos").files) dados.append("arquivos", arquivo);
  dados.append("extrair_com_agentes", $("com-agentes").checked);
  $("enviar").disabled = true;
  try {
    mostrarJob("Enviando arquivos…");
    const envio = await api(`/api/processos/${encodeURIComponent(estado.processo)}/documentos`, { method: "POST", body: dados });
    $("arquivos").value = "";
    await acompanhar(envio.job_id);
  } catch (erro) {
    mostrarJob(erro.message, true);
  } finally {
    $("enviar").disabled = false;
  }
});

// ------------------------------------------------------------------ eventos

$("pergunta").addEventListener("submit", (e) => { e.preventDefault(); perguntar($("texto").value); });
$("texto").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); perguntar($("texto").value); }
});
$("processo").addEventListener("change", (e) => abrirProcesso(e.target.value).catch(falha));
$("criar").addEventListener("click", async () => {
  const campo = $("novo-processo");
  const nome = campo.value.trim();
  if (!nome || !campo.checkValidity()) { campo.reportValidity(); return; }
  campo.value = "";
  await carregarProcessos(nome).catch(falha);
  await abrirProcesso(nome).catch(falha);
});
$("chave").addEventListener("change", () => iniciar());
for (const botao of document.querySelectorAll("nav button")) {
  botao.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("ativo", b === botao));
    document.querySelectorAll(".aba").forEach((a) => a.classList.toggle("ativa", a.id === `aba-${botao.dataset.aba}`));
  });
}
for (const texto of SUGESTOES) {
  const botao = document.createElement("button");
  botao.type = "button";
  botao.textContent = texto;
  botao.onclick = () => perguntar(texto);
  $("sugestoes").append(botao);
}

function falha(erro) { mensagem("erro", erro.message); }

async function iniciar() {
  try {
    const info = await api("/api/info");
    $("modelo").textContent = `modelo: ${info.modelo}`;
    $("chave-area").classList.toggle("oculto", !info.exige_chave);
    $("com-agentes").disabled = !info.extracao_com_agentes;
    if (!info.extracao_com_agentes) $("com-agentes").checked = false;
    if (info.exige_chave && !$("chave").value) return;
    await carregarProcessos();
    desenharSubabas();
  } catch (erro) { falha(erro); }
}
iniciar();
</script>
