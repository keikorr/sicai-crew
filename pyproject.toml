[project]
name = "sicai"
version = "0.2.0"
description = "Assistente multiagente para análise de processos criminais, com crewAI"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm]>=1.15.39,<2.0.0",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic",
    "numpy",
    "PyMuPDF",
    "python-dotenv",
    "sentence-transformers",
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
kickoff = "sicai.main:kickoff"
run_crew = "sicai.main:kickoff"
plot = "sicai.main:plot"
serve = "sicai.main:serve"
ingest = "sicai.main:ingest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sicai"]

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
